events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    server {
        listen 80;

        # Web App (Root)
        location / {
            proxy_pass http://web-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Strudel Instance
        # We rewrite the path so Strudel sees it as root if needed, 
        # but Strudel assets are usually absolute.
        # We'll use a specific prefix '/strudel/'
        
        location /strudel/ {
            # Rewrite /strudel/foo to /foo for the upstream
            rewrite ^/strudel/(.*) /$1 break;
            proxy_pass http://strudel-web:4321;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Shared Assets / Fallbacks
        # Strudel uses /_astro/ for assets
        location /_astro/ {
            proxy_pass http://strudel-web:4321/_astro/;
        }
        
        # Strudel samples and modules
        location /samples/ {
            proxy_pass http://strudel-web:4321/samples/;
        }
        location /modules/ {
            proxy_pass http://strudel-web:4321/modules/;
        }
        
        # Strudel also uses @fs/ for vite dev server sometimes?
        location /@fs/ {
             proxy_pass http://strudel-web:4321/@fs/;
        }
        location /@id/ {
             proxy_pass http://strudel-web:4321/@id/;
        }
        location /src/ {
             proxy_pass http://strudel-web:4321/src/;
        }
        location /node_modules/ {
             proxy_pass http://strudel-web:4321/node_modules/;
        }
    }
}
