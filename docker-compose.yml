version: '3.8'

services:
  # 1. The Frontend (Algorave Hub)
  app:
    build:
      context: ./web
    container_name: algorave-hub
    ports:
      - "3000:3000"
    volumes:
      - ./examples:/app/public/examples
    environment:
      - NODE_ENV=production
    networks:
      - algorave_network

  # 2. The Chat (Open WebUI)
  chat:
    image: ghcr.io/open-webui/open-webui:main
    container_name: algorave-chat
    restart: always
    ports:
      - "8080:8080"
    environment:
      - WEBUI_Q_ORIGINS=http://localhost:3000
      - MCP_SERVERS={"strudel":"http://strudel-mcp:3001/sse"}
    volumes:
      - open-webui:/app/backend/data
    networks:
      - algorave_network
    depends_on:
      - strudel-mcp

  # 3. BASE SERVICE: Builds the vanilla local fork
  # Image Name: algorave/mcp-base:latest
  mcp-base:
    build:
      context: ./strudel-mcp-server
      dockerfile: Dockerfile
    image: algorave/mcp-base:latest
    container_name: mcp-base-builder
    entrypoint: [ "/bin/true" ]
    networks:
      - algorave_network

  # 4. BRIDGE SERVICE: Derived from Base
  # Image Name: algorave/mcp-bridge:latest
  strudel-mcp:
    build:
      context: .
      dockerfile: docker/strudel-mcp/Dockerfile
    container_name: algorave-mcp
    image: algorave/mcp-bridge:latest
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - algorave_network
    restart: unless-stopped
    depends_on:
      - mcp-base

  # 5. Strudel Web (Offline REPL)
  strudel-web:
    build:
      context: .
      dockerfile: docker/strudel-web/Dockerfile
    container_name: algorave-strudel
    ports:
      - "4321:4321"
    networks:
      - algorave_network

  # 6. Documentation Builder (Pandoc)
  docs:
    image: pandoc/core
    volumes:
      - .:/data
    command: [ "WORKSHOP.md", "-t", "revealjs", "-s", "-o", "web/public/presentation.html", "-V", "theme=black", "-V", "revealjs-url=https://unpkg.com/reveal.js", "--slide-level=2", "--css=doc/custom.css" ]

volumes:
  open-webui:


networks:
  algorave_network:
    driver: bridge
