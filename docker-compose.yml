services:
  mcp-server:
    build:
      context: ./strudel-mcp-server
      dockerfile: ../docker/mcp-wrapper.Dockerfile
    container_name: algorave-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./strudel-mcp-server/patterns:/app/patterns
      # Mount config if needed, though Dockerfile creates a default one
    environment:
      - NODE_ENV=production
    networks:
      - algorave_network

  strudel-web:
    build:
      context: .
      dockerfile: docker/strudel.Dockerfile
    ports:
      - "4321:4321"
    volumes:
      - ./strudel:/app
      - /app/node_modules
      - /app/website/node_modules
    networks:
      - algorave_network
    environment:
      - HOST=0.0.0.0

  web-app:
    build:
      context: ./web
      args:
        # Point to the Proxy URL for Strudel
        NEXT_PUBLIC_LOCAL_STRUDEL_URL: "http://localhost:8080/strudel/"
      dockerfile: Dockerfile
    container_name: algorave-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_USE_EXTERNAL_STRUDEL=${NEXT_PUBLIC_USE_EXTERNAL_STRUDEL:-false}
      - MCP_SERVER_HOST=mcp-server # Connect to the mcp-server container
      # If MCP is server-side (Next API routes), localhost refers to container.
      # If MCP is client-side, it needs public URL.
      # Current setup assumes MCP is accessed via Next API routes proxying to backend?
      # Or direct connection?
      # Let's stick to what worked, just changing Strudel URL.
      - MCP_SERVER_PORT=3000
    volumes:
      - ./examples:/app/public/examples
      - ./doc:/app/public/doc
    depends_on:
      - mcp-server
      # - strudel-web # Optional dependency
    networks:
      - algorave_network

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app
      - strudel-web
    networks:
      - algorave_network

  docs:
    image: pandoc/core
    volumes:
      - .:/data
    command: [ "WORKSHOP.md", "-t", "revealjs", "-s", "-o", "web/public/presentation.html", "-V", "theme=black", "-V", "revealjs-url=https://unpkg.com/reveal.js", "--slide-level=2", "--css=doc/custom.css" ]
    # Optional strudel backend (only if requested, commented out for now or minimal)
    # Optional strudel backend (only if requested, commented out for now or minimal)
    # strudel-backend:
    #   ...

networks:
  algorave_network:
    driver: bridge
