name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "feature/hosted-strudel"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment  
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Presentation (Pandoc)
        run: |
          docker run --rm -v ${{ github.workspace }}:/data pandoc/core \
            WORKSHOP.md -t revealjs -s -o web/public/presentation.html \
            -V theme=black -V revealjs-url=https://unpkg.com/reveal.js \
            --slide-level=2 --css=doc/custom.css

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Strudel Dependencies
        working-directory: strudel
        run: pnpm install

      - name: Build Strudel
        working-directory: strudel
        # We run prebuild (Generate docs etc), then build website with specific base and site
        run: |
          pnpm run prebuild
          cd website
          pnpm run build -- --site "https://alienmind.github.io" --base "/algorave/strudel"

      - name: Prepare Deployment Artifact
        run: |
          mkdir _site
          # Copy presentation and public assets
          cp -r web/public/* _site/
          # Rename presentation to index.html (Main entry point)
          mv _site/presentation.html _site/index.html
          # Create directory for strudel and copy build result
          mkdir -p _site/strudel
          cp -r strudel/website/dist/* _site/strudel/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
